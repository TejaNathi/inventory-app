<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThinkMetal Cart Importer</title>
<style>
  :root {
    --bg: #0f0f0f; --surface: #171717; --surface2: #1f1f1f;
    --border: #2a2a2a; --text: #e8e8e8; --text2: #999; --text3: #555;
    --accent: #e8ff47; --green: #4ade80; --red: #f87171; --amber: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 320px; min-height: 200px;
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg); color: var(--text); font-size: 13px;
  }

  .header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .header-logo { font-size: 11px; font-weight: 600; color: var(--accent); letter-spacing: 0.08em; }
  .header-sub { font-size: 11px; color: var(--text3); }

  .body { padding: 16px; }

  .status-row {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-radius: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    margin-bottom: 14px; font-size: 12px;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-ok { background: var(--green); }
  .dot-warn { background: var(--amber); }
  .dot-err { background: var(--red); }

  .vendor-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
  }
  .vendor-label { font-size: 11px; color: var(--text2); flex-shrink: 0; }
  .vendor-badge {
    font-size: 11px; padding: 3px 10px; border-radius: 20px;
    background: rgba(232,255,71,0.1); color: var(--accent);
    border: 1px solid rgba(232,255,71,0.2); font-weight: 500;
  }
  .vendor-badge.unknown { background: var(--surface2); color: var(--text2); border-color: var(--border); }

  .btn {
    width: 100%; padding: 10px; border-radius: 8px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    border: none; font-family: inherit; transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: #d4eb3a; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .loading {
    display: none; text-align: center;
    padding: 12px; font-size: 12px; color: var(--text2);
  }
  .loading.show { display: block; }

  .result { display: none; padding: 10px 12px; border-radius: 8px; font-size: 12px; margin-top: 12px; }
  .result.success { background: rgba(74,222,128,0.1); color: var(--green); border: 1px solid rgba(74,222,128,0.2); }
  .result.error { background: rgba(248,113,113,0.1); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }
  .result.show { display: block; }

  .footer {
    padding: 10px 16px; border-top: 1px solid var(--border);
    font-size: 10px; color: var(--text3); text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-logo">THINKMETAL</div>
    <div class="header-sub">Cart importer</div>
  </div>
</div>

<div class="body">

  <div class="status-row">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Checking page...</span>
  </div>

  <div class="vendor-row">
    <span class="vendor-label">Detected:</span>
    <span class="vendor-badge" id="vendor-badge">Detecting...</span>
  </div>

  <button class="btn btn-primary" id="send-btn" onclick="sendCart()" disabled>
    Send cart to inventory app
  </button>

  <div class="loading" id="loading">⟳ Extracting items...</div>

  <div class="result" id="result"></div>

</div>

<div class="footer">ThinkMetal internal tool · Cart Importer v1.0</div>

<script src="popup.js"></script>
</body>
</html>
